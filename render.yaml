# Render Blueprint — free tier. Render's free plan has no Background Worker resource
# type at all, so the BullMQ workers run in-process inside the API instead (gated by
# RUN_WORKER_INLINE below — see server/src/index.ts). If budget allows a paid worker
# later, that's the more correct shape: this API process spinning down on inactivity
# (free-tier behavior) pauses job processing until the next request wakes it, whereas
# a dedicated worker has no such gap.
#
# Deploy: Render Dashboard -> New -> Blueprint -> point at this repo.
# Then set the `sync: false` secrets below in the dashboard (they are deliberately
# not committed).
#
# Free-tier spin-down + webhooks: when this instance is asleep, Zoom's webhook
# POST is itself the request that wakes it — Render queues that first request
# while the instance cold-starts rather than dropping it, but Zoom's own
# webhook-delivery timeout is short enough that a cold start (dependency
# install is already done at build time, so this is just process boot +
# DB/Redis reconnect) could plausibly exceed it under a slow boot. Not
# verified against a real forced-cold-start timing test — if webhooks are
# ever silently missed in practice, check delivery timing here before
# assuming it's a signature/config bug elsewhere.

envVarGroups:
  - name: zri-shared
    envVars:
      - key: NODE_ENV
        value: production
      # Generate with: node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: ZOOM_CLIENT_ID
        sync: false
      - key: ZOOM_CLIENT_SECRET
        sync: false
      - key: ZOOM_WEBHOOK_SECRET_TOKEN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_TENANT_ID
        value: common
      - key: OUTBOUND_MESSAGE_ID_DOMAIN
        sync: false
      # All of these must be your PUBLIC Vercel origin, not the Render URL — the
      # browser talks to Vercel, which proxies /api through to this service.
      #
      # ORDER MATTERS: the server derives its post-OAuth redirect target from
      # the FIRST entry of this comma-separated list. Nothing in the Render
      # dashboard enforces that — a future edit that reorders or appends
      # entries here will silently change where OAuth redirects land, with no
      # error. If this list ever needs more than one origin, prefer adding
      # explicit config.ts validation (or a separate OAUTH_REDIRECT_ORIGIN var)
      # over relying on array position.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: ZOOM_REDIRECT_URI
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: MICROSOFT_REDIRECT_URI
        sync: false

services:
  # Name MUST match the service already live in the Render dashboard
  # (backend-for-zoom) — Render's Blueprint sync matches services by name, so
  # changing this creates a brand-new orphaned service instead of adopting the
  # existing one, rather than renaming it. Confirmed the hard way once already;
  # don't rename this without renaming the live service first, in that order.
  - type: web
    name: backend-for-zoom
    runtime: node
    plan: free
    region: oregon
    branch: main
    # --include=dev: NODE_ENV=production above makes plain `npm install` skip
    # devDependencies, which is where typescript/@types/prisma live — the build
    # needs them even though the app runs in production.
    buildCommand: npm install --include=dev && npm run build --workspace server && npm run prisma:deploy --workspace server
    startCommand: npm run start --workspace server
    # Must be a real Express route on THIS service (server/src routes, not
    # behind /api). Don't confuse this with the README's note that /health
    # 404s/serves the SPA on the local ngrok tunnel — that's about Vite only
    # proxying /api/* in local dev; here it's hitting Express directly, so the
    # route must actually exist and return 200 or Render will treat every
    # deploy as unhealthy and keep swapping it out.
    healthCheckPath: /health
    envVars:
      - fromGroup: zri-shared
      - key: NODE_VERSION
        value: "22"
      - key: RUN_WORKER_INLINE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: zri-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: zri-redis
          property: connectionString

  - type: redis
    name: zri-redis
    plan: free
    region: oregon
    # BullMQ requires noeviction. Under any eviction policy Redis may drop job data
    # under memory pressure, which silently loses queued meetings rather than erroring.
    maxmemoryPolicy: noeviction
    # Private network only — nothing outside these services should reach the queue.
    ipAllowList: []

databases:
  - name: zri-postgres
    plan: free
    region: oregon
    postgresMajorVersion: "16"
